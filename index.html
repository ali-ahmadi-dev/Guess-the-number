<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <header>
      <h1>حدس  بزن عدد چیه 😊</h1>
      <p class="between">(حدس عدد بین  1 تا 20)</p>
      <button class="btn again"> دویاره  🔃 </button>
      <div class="number">?</div>
    </header>
    <main>
      <section class="left">
        <input type="number" class="guess" />

    <!-- Check Btn -->
        <button class="btn check"> برسی  !</button>

     <!-- Check btn End -->
      </section>
      <section class="right">
        <p class="message">   حدس بزن عدد چیه  .... </p>
        <p class="label-score">💯  امتیاز :  <span class="score">20</span></p>
        <p class="label-highscore">
          🥇 بالاترین امتیاز  : <span class="highscore">0</span>
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
